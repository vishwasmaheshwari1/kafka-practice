version: '3.8'

services:
  kafka-cluster:
    image: lensesio/fast-data-dev:3.9.0
    container_name: fast-data-dev
    # REMOVED hostname: localhost to prevent loopback confusion
    environment:
      # 1. Standard loopback format for single-container architectures
      ADV_HOST: 127.0.0.1      

      # 2. Maps clean endpoints directly out to your host web browser
      REGISTRY_URL: "http://localhost:8081"
      PROXY_URL: "http://localhost:8082"
      CONNECT_URL: "http://localhost:8083"
      
      RUNTESTS: 0                 
      FORWARDLOGS: 0              
      SAMPLEDATA: 0               
      DISABLE: debezium-mongodb,debezium-mysql,debezium-postgres,debezium-sqlserver,debezium-jdbc
    ports:
      - "3030:3030"
      - "8081:8081"
      - "8083:8083"
      - "9581-9585:9581-9585"
      - "9092:9092"
    restart: unless-stopped



