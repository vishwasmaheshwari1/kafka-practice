plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Apache Kafka 4.0.0 Client Library
    implementation 'org.apache.kafka:kafka-clients:4.0.0'

    // Recommended Logging SLF4J Implementation
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'org.slf4j:slf4j-simple:2.0.12'

    // Source: https://mvnrepository.com/artifact/org.opensearch.client/opensearch-rest-high-level-client
//    implementation 'org.opensearch.client:opensearch-rest-high-level-client:3.7.0'

    implementation 'org.opensearch.client:opensearch-java:3.7.0'
    implementation 'org.opensearch.client:opensearch-rest-client:3.7.0'

    // Source: https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation 'com.google.code.gson:gson:2.14.0'
}

test {
    useJUnitPlatform()
}